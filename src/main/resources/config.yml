# FastBuilder Configuration

# Plugin prefix for messages (include trailing space)
prefix: "&c&lFastbuilder &7>> &f"

# Default map for new players (leave empty for none)
default-map: "Hell"

# Economy
reset-stats-cost: 100
coins-per-second: 0.5
coins-per-completion: 10

# Maximum distance from island edge before teleport to spawn (blocks)
max-distance: 4

# Holograms (requires DecentHolograms)
# Placeholders: %player%, %pb%, %successful_attempts%, %total_attempts%
holograms:
  enabled: true
  lines:
    - "&c%player%'s Stats"
    - "&fPersonal Best: &c%pb%"
    - "&fSuccessful Runs: &c%successful_attempts%"
    - "&fTotal Attempts: &c%total_attempts%"

# NPCs (requires Citizens)
npcs:
  enabled: true
  name: "&cMap Selector"

# Scoreboard
# Placeholders: %map%, %pb%, %current_time%, %top1%, %top2%, %top3%, %players%, %coins%
scoreboard:
  title: "&c&lFastbuilder"
  lines:
    13: "&7&m-------------------"
    12: "&8>> &cMap: &f%map%"
    11: "&8>> &cBest: &f%pb%"
    10: "&8>> &cTime: &a%current_time%"
    9: "&f "
    8: "&7Top Session:"
    7: "&8#1 &f%top1%"
    6: "&8#2 &f%top2%"
    5: "&8#3 &f%top3%"
    4: "&f  "
    3: "&8>> &cPlayers: &f%players%"
    2: "&7&ogravijet.net"
    1: "&7&o&m-------------------"

# Autoscale defaults
autoscale:
  min-islands: 15
  scale-threshold: 80

# Map spacing (blocks between different map types)
map-spacing: 2000

# Default Y level for new map origins
default-y: 20

# Auto-refill perk cost (coins)
auto-refill-cost: 5000

# BungeeCord
bungee:
  enabled: true
  lobby-server: "Lobby-1"
