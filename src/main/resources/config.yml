# FastBuilder Configuration

# World where islands are generated
world: world

# Y-level of island platforms
island-y: 64

# Spacing between player island slots (in blocks)
island-spacing: 300

# Default block material (must match a BridgeMaterial enum name)
default-material: COBBLESTONE

# Default distance for quick-practice mode (must match a BridgeDistance enum name)
default-distance: NORMAL
