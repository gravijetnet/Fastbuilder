# FastBuilder Configuration
# ──────────────────────────────────────────────────────────────────────────────
# Storage backend
# ──────────────────────────────────────────────────────────────────────────────
storage:
  # Backend: yaml | sqlite | mysql
  # yaml   → one .yml file per player (default, no extra setup)
  # sqlite → single fastbuilder.db file (faster reads, concurrent-safe)
  # mysql  → external database (best for multi-server / high player counts)
  type: yaml

  mysql:
    host: "localhost"
    port: "3306"
    database: "fastbuilder"
    user: "root"
    password: ""

# ──────────────────────────────────────────────────────────────────────────────
# Plugin prefix for messages (include trailing space)
prefix: "&c&lFastbuilder &7» &f"

# Default map for new players (leave empty for none)
default-map: "SuperShort"

# Economy
reset-stats-cost: 2000
# Playtime reward: coins awarded per hour of active playtime
coins-per-hour: 150
# Base coins awarded per completion (scales dynamically with time — faster = more)
coins-per-completion: 10

# Maximum distance from island edge before teleport to spawn (blocks)
max-distance: 4

# How many blocks above the finish zone Y-max a player can still trigger finish
finish-height-tolerance: 5

# Global minimum valid run time in milliseconds. Times faster than this are not recorded.
min-valid-time: 500

# Holograms (requires DecentHolograms)
# Placeholders: %player%, %pb%, %successful_attempts%, %total_attempts%
holograms:
  enabled: true
  lines:
    - "&c%player%'s Stats"
    - "&fPersonal best: &c%pb% &7%top_percent%"
    - "&fSuccessful Runs: &c%successful_attempts%"
    - "&fTotal Attempts: &c%total_attempts%"

# NPCs
npcs:
  enabled: true
  name: "&cMap Selector"

# Scoreboard
# Placeholders: %map%, %pb%, %current_time%, %coins%, %blocks%
#   Granular top-10: %top_name_N% (name), %top_time_N% (time), N = 1..10
#   PlaceholderAPI: any %papi_placeholder% is supported
# update-interval: ticks between scoreboard refreshes (20 = 1 second)
scoreboard:
  title: "&c&lFastbuilder"
  update-interval: 1
  lines:
    - "&7&m-------------------"
    - "&cPersonal Best:"
    - "&8» &f%pb%"
    - ""
    - "&cSession-Top:"
    - "%phoenix_player_rank_color%%top_name_1%&7: &f%top_time_1%"
    - "%phoenix_player_rank_color%%top_name_2%&7: &f%top_time_2%"
    - "%phoenix_player_rank_color%%top_name_3%&7: &f%top_time_3%"
    - ""
    - "&cBlocks:"
    - "&8» &f%blocks%"
    - ""
    - "&7&ogravijet.net"
    - "&7&m-------------------"

# Action bar settings
actionbar:
  # Format shown during an active run. Leave empty to disable.
  # Placeholder: %timer%
  format: "&7Time &8» &c%time%"
  # Only show when a run is active (timer has started). If false, always shown on island.
  only-when-running: true

# Replay settings
replay:
  # How the player's name is shown on the replay NPC.
  # "recorded" = use the name as it was at the time of the run.
  # "current"  = update to the player's current username (if resolvable).
  player-name-mode: "recorded"
  # Maximum replays stored per player per map. -1 = unlimited.
  # Permission nodes fastbuilder.replays.N override this per-player.
  max-replays: 20

# Finish trigger mode:
#   "zone"  - enter the finish zone bounding box (default, works with any blocks)
#   "touch" - step on a pressure plate inside the finish zone
finish-trigger-mode: "zone"

# Island hopping: when a player crosses into a neighbor island
# enabled=true → empty target = auto-switch session; occupied target = reset
# enabled=false → always reset when leaving own island Z bounds
island-hopping:
  enabled: true

# Autoscale defaults
autoscale:
  min-islands: 15
  scale-threshold: 80

# Map spacing (distance between different map types)
map-spacing: 2000

# Default Y level for new map origins
default-y: 20

# Auto-refill perk cost (coins)
auto-refill-cost: 1000

# Infinite Blocks perk unlock cost (coins)
infinite-blocks-unlock-cost: 1000

# ──────────────────────────────────────────────────────────────────────────────
# Infinite map isolation offset
# Infinite maps are placed at an isolated coordinate block to prevent players
# from building into normal maps. Configure X and Z offsets here.
# ──────────────────────────────────────────────────────────────────────────────
infinite-map-offset:
  x: 2000
  z: -10000

# ──────────────────────────────────────────────────────────────────────────────
# Reset animations
# ──────────────────────────────────────────────────────────────────────────────
animation:
  # Blocks processed per tick in sequential animations (FALL_DOWN, ITEM_DROP, etc.)
  # Lower = slower/smoother; higher = faster clear. Recommended: 2-5.
  blocks-per-tick: 3
  # Ticks between batches (1 = every tick). Increase for slower dramatic effects.
  tick-interval: 1

# ──────────────────────────────────────────────────────────────────────────────
# Per-item permissions
# Items use individual permission nodes (e.g., fastbuilder.block.stained_clay.5,
# fastbuilder.animation.fall_down, fastbuilder.sound.creeper, fastbuilder.pickaxe.diamond_pickaxe.0).
# Players with the permission can use the item without purchasing.
# ──────────────────────────────────────────────────────────────────────────────

# Leave item: given to the player in hotbar slot 8 so they can leave the server/game.
# action: "BUNGEE" → send to lobby-server via BungeeCord
#          "SPAWN"  → teleport to world spawn
#          "COMMAND" → run leave-command as the player
leave-item:
  action: "SPAWN"
  lobby-server: "Lobby-1"
  leave-command: ""

# ──────────────────────────────────────────────────────────────────────────────
# Custom Length — end-island platform
# When a player adjusts their custom length in the settings menu, a small
# platform is placed at the finish position so they have a visible target.
# ──────────────────────────────────────────────────────────────────────────────
custom-length:
  end-platform:
    # Block material and data value for the platform (format "MATERIAL:DATA")
    material: "STAINED_GLASS_PANE:5"
    # How many blocks deep (Z-axis) the platform extends.
    # 0 = span the full finish-zone Z range; positive = use this fixed depth.
    depth: 3

# ──────────────────────────────────────────────────────────────────────────────
# CPS hologram visibility
# "global"  → all players on the server can see the CPS hologram
# "private" → only the player who clicked the sapling sees their own hologram
# ──────────────────────────────────────────────────────────────────────────────
cps-hologram:
  visibility: "global"
