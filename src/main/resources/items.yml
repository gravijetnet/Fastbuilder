# FastBuilder Hotbar Items

# Leave item (BungeeCord transfer)
leave-item: "&cLeave &7(Right-Click to use)"
leave-item-material: EYE_OF_ENDER:0
leave-item-toggled: false
backend-server: lobby

# Replay viewer item
replay-item: "&5Replay View &7(Right-Click to use)"
replay-item-material: BOOK:0

# Island selector item
islandselector-item: "&6Island Selector &7(Right-Click to use)"
islandselector-item-material: NETHER_STAR:0

# Settings item
settings-item: "&2Settings &7(Right-Click to use)"
settings-item-material: EMERALD:0

# Shop item
shop-item: "&6Shop &7(Right-Click to use)"
shop-item-material: "GOLD_NUGGET:0"

# Page navigation items
change-page:
  next-page:
    material: ARROW:0
    name: "&aNext Page &7»"
    lore:
      - "&7Click to go to the next page."
  previous-page:
    material: ARROW:0
    name: "&c« Previous Page"
    lore:
      - "&7Click to go to the previous page."
  # Shown when there is no previous/next page (always-visible disabled state)
  no-previous-page:
    material: ARROW:0
    name: "&8« No Previous Page"
    lore:
      - "&7You are on the first page."
  no-next-page:
    material: ARROW:0
    name: "&8No Next Page »"
    lore:
      - "&7You are on the last page."
  # Back to parent menu
  back-to-shop:
    material: BARRIER:0
    name: "&cBack to Shop"
    lore:
      - "&7Return to the main shop."

# Island Selector back button (closes the menu)
island-selector:
  back-button:
    material: BARRIER:0
    name: "&cClose"
