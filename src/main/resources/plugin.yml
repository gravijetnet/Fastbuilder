name: FastBuilder
version: 2.0.0
main: net.gravijet.fastbuilder.Main
api-version: 1.8
author: GraviJet
description: Bridging practice plugin – custom maps, player NPC, paginated block selector.

commands:
  fb:
    description: FastBuilder main command
    usage: /fb <help|spawn|reset|stats|map|setspawn|reload>
    aliases: [fastbuilder]
    permission: fastbuilder.use

permissions:
  fastbuilder.use:
    description: Allows using FastBuilder commands
    default: true
  fastbuilder.admin:
    description: Admin commands (map management, setspawn, reload)
    default: op
  fastbuilder.stats.others:
    description: View other players' stats
    default: op
