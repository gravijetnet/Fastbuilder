name: FastBuilder
version: 1.0.0
main: net.gravijet.fastbuilder.Main
api-version: 1.8
author: GraviJet
description: Bridging practice plugin – train your bridging skills.

commands:
  fb:
    description: FastBuilder main command
    usage: /fb <help|spawn|reset|stats|setspawn|reload>
    aliases: [fastbuilder]
    permission: fastbuilder.use

permissions:
  fastbuilder.use:
    description: Allows using FastBuilder commands
    default: true
  fastbuilder.admin:
    description: Allows admin FastBuilder commands (setspawn, reload)
    default: op
  fastbuilder.stats.others:
    description: Allows viewing other players' stats
    default: op
