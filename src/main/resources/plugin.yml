name: FastBuilder
version: 1.0.0
main: net.gravijet.FastBuilderPlugin
api-version: 1.8
author: FastBuilder Dev
description: Bridging / FastBuilder Übungsserver Plugin

commands:
  f:
    description: FastBuilder Hauptbefehl
    usage: /f <setspawn|spawn> <islandId>
    permission: fastbuilder.use

permissions:
  fastbuilder.use:
    description: Erlaubt grundlegende FastBuilder Befehle
    default: true
  fastbuilder.admin:
    description: Admin-Rechte (setspawn etc.)
    default: op