  setup-select-finish: "%prefix%&7Mark the finish &8» &7left-click pos 1, right-click pos 2."
  setup-finish-pos1: "%prefix%&7Finish corner 1 &8» &f%x% %y% %z%"
  setup-finish-pos2: "%prefix%&7Finish corner 2 &8» &f%x% %y% %z%"
