# FastBuilder Messages
# Palette: &c highlight / &f text / &7 muted / &8 separator
# Tip: keep lines short. The plugin prefix is prepended via %prefix%.

# Action bar shown during a run. %time% = current run timer.
action-bar: "&7Time &8» &c%time%"

# ──────────────────────────────────────────────────────────────────────────────
# Completion messages
# Placeholders: %time%, %pb%, %difference%, %coins%, %booster%
# ──────────────────────────────────────────────────────────────────────────────
end-messages:
  time:
    - ""
    - "  &c&lFINISHED"
    - "  &7%time%  &8|  &7best &f%pb%  &8|  &7%difference%"
    - ""
  personal-best:
    - ""
    - "  &c&lNEW RECORD"
    - "  &f%time%  &8|  &7-%difference% &8from PB"
    - ""

# ──────────────────────────────────────────────────────────────────────────────
# General messages
# Placeholders: %prefix%, %map%, %island_player%, %island_number%, %command%,
#               %player%, %coins%, %amount%, %time%, %rank%
# ──────────────────────────────────────────────────────────────────────────────
messages:
  joined-mode: "%prefix%&7Welcome to &f%map%&7."
  island-already-occupied: "%prefix%&cThat island belongs to &f%island_player%&c."
  island-joined: "%prefix%&7Moved to island &f#%island_number%&7."
  no-permission: "%prefix%&cYou can't do that."
  usage: "%prefix%&7Usage &8» &f%command%"
  player-not-found: "%prefix%&cCan't find &f%player%&c."
  map-not-found: "%prefix%&cNo map called &f%map%&c."
  map-disabled: "%prefix%&f%map% &7is currently disabled."
  no-free-islands: "%prefix%&cAll islands are taken right now."
  island-scaling: "%prefix%&7Spinning up a new island &8— &fjust a sec."
  cannot-build-here: "%prefix%&cStay on your own island."
  teleported-default: "%prefix%&7Sent you to the default map."
  map-already-on: "%prefix%&7You're already on this map."
  practice-blocks-cleared: "%prefix%&7Practice blocks cleared."
  setup-spawn-not-east: "%prefix%&cSpawn must face east. Re-select or use &f/map setup continue --force&c."
  no-islands: "%prefix%&cNo islands available."
  playtime-reward: "%prefix%&6+%coins% coins &7&ofor playtime"
  min-time-not-recorded: "%prefix%&cToo fast to record &8(&7%time%&8)"
  max-time-exceeded: "%prefix%&cRun expired &8— &7time limit reached"
  rank-achieved: "%prefix%&7You reached &c%rank% &7on &f%map%&7."
  coins-balance: "%prefix%&7Balance &8» &6%coins% coins"
  coins-balance-other: "%prefix%&f%player% &7has &6%coins% coins&7."
  coins-added: "%prefix%&a+%amount% &7to &f%player%"
  coins-removed: "%prefix%&c-%amount% &7from &f%player%"
  coins-set: "%prefix%&f%player%&7's balance &8» &6%amount%"
  coins-not-enough: "%prefix%&cNot enough coins."
  coins-not-enough-other: "%prefix%&f%player% &cdoesn't have enough coins."
  coins-applied-all: "%prefix%&7Applied to &f%count% &7online players."
  invalid-amount-value: "%prefix%&cInvalid amount &8» &f%amount%"
  amount-non-negative: "%prefix%&cAmount must be zero or higher."
  build-mode-enter: "%prefix%&aBuild mode on &7&o— use /build to exit"
  build-mode-exit: "%prefix%&7Build mode off."
  build-mode-not-on-island: "%prefix%&cYou need to be on an island for build mode."

  # Join / leave flow
  no-maps-configured: "%prefix%&fNo maps are configured yet."
  left-game: "%prefix%&7See you next time."
  left-map-build-mode: "%prefix%&7Left your island &8» &abuild mode active"

  # Shop / cosmetic feedback (shared across pickaxe / animation / sound / design / booster shops)
  shop-not-enough-coins: "%prefix%&cNot enough coins &8» &7need &6%price%&7."
  shop-unlocked: "%prefix%&aUnlocked &f%item% &7&o(-%price% coins)"
  shop-block-selected: "%prefix%&7Block &8» &f%item%"
  shop-pickaxe-selected: "%prefix%&7Tool &8» &f%item%"
  shop-animation-selected: "%prefix%&7Animation &8» &f%item%"
  shop-death-sound-selected: "%prefix%&7Death sound &8» &f%item%"
  one-click-pick-unlocked: "%prefix%&aOne-Click Pick unlocked &7&o(-%price% coins)"
  one-click-pick-on: "%prefix%&7One-Click Pick &8» &aon"
  one-click-pick-off: "%prefix%&7One-Click Pick &8» &coff"

  # Booster shop / inventory feedback
  booster-purchased: "%prefix%&7Purchased &f%type% &8» &7activate it from your Booster Inventory."
  booster-activated: "%prefix%&7%multiplier% Coin Booster activated &8» &f%duration% minutes"
  booster-already-active: "%prefix%&cYou already have an active booster &8» &7%remaining% left."
  booster-activate-failed: "%prefix%&cCouldn't activate that booster."

  # Custom length
  custom-length-unavailable: "%prefix%&cCustom length isn't available on this map."
  custom-length-no-permission: "%prefix%&cYou don't have permission to use custom length."
  custom-length-set: "%prefix%&7Length &8» &f%length% blocks"
  custom-length-reset: "%prefix%&7Length reset &8» &f%length% blocks"
  custom-length-defaults-reset: "%prefix%&7Distance and height reset to defaults."
  custom-length-range: "%prefix%&cLength must be between &f%min% &cand &f%max% &cblocks."
  custom-length-at-max-distance: "%prefix%&cAt max distance &8(&f%max% blocks&8)"
  custom-length-at-min-distance: "%prefix%&cAt min distance &8(&f%min% blocks&8)"
  custom-length-at-max-height: "%prefix%&cAt max height &8(&f+%max%&8)"
  custom-length-at-min-height: "%prefix%&cAt min height &8(&f%min%&8)"
  custom-length-current: "%prefix%&7Length &8» &f%current% &8(&7%min%-%max%&8)"
  custom-length-usage: "%prefix%&7Usage &8» &f/length <blocks> &7or &f/length reset"

  # Practice mode
  practice-no-permission: "%prefix%&cYou don't have permission for practice mode."
  practice-mode-on: "%prefix%&7Practice mode &8» &aon"
  practice-mode-off: "%prefix%&7Practice mode &8» &coff"
  practice-blocks-required-clear: "%prefix%&cClear practice blocks before starting a real run."

  # Infinite blocks
  infinite-blocks-on: "%prefix%&7Infinite Blocks &8» &aon"
  infinite-blocks-off: "%prefix%&7Infinite Blocks &8» &coff"
  infinite-blocks-unlocked: "%prefix%&7Infinite Blocks unlocked &8» &6-%amount% coins"

  # Generic UI feedback
  not-on-island: "%prefix%&cYou're not on an island."
  players-only: "%prefix%&cOnly players can use this."
  island-reset: "%prefix%&7Island reset."
  stats-reset: "%prefix%&7Stats reset."
  config-reloaded: "%prefix%&aConfig reloaded."

  # Island designs (shown when a player switches design in the shop)
  design-applied: "%prefix%&7Design &8» &f%design%"
  design-already-active: "%prefix%&7That design is already active."
  design-unlocked: "%prefix%&7Design unlocked &8» &f%design% &8(&6-%price% coins&8)"

  # Replays
  replay-loading: "%prefix%&7Loading replay&8..."
  replay-favorite-added: "%prefix%&7Added to favorites."
  replay-favorite-removed: "%prefix%&7Removed from favorites."
  replay-unavailable: "%prefix%&cReplays aren't available right now."
  replay-none-found: "%prefix%&cNo replay for &f%player% &con &f%map%&c."
  replay-finished: "%prefix%&7Replay finished &8» &aclick to watch again &7or leave."

# ──────────────────────────────────────────────────────────────────────────────
# Run-finish notices (titles shown above the hotbar at the end of a run)
# These cover non-ranked finishes; ranked finishes use title/subtitle + end-messages.
# Placeholders: %time%, %blocks%, %coins%
# ──────────────────────────────────────────────────────────────────────────────
finish:
  practice-title: "&6Practice &8» &f%time%"
  finish-title: "&aFinish &8» &f%time%"
  note-infinite: "&7Infinite &8» &f%blocks% blocks"
  note-custom: "&7Custom &8» &f%blocks% blocks"
  fail-title: "&c&lFAILED"
  fail-coins: "&7+%coins% coins"

# ──────────────────────────────────────────────────────────────────────────────
# Completion title / subtitle shown above the hotbar
# Placeholders: %time%, %coins%, %booster%
# ──────────────────────────────────────────────────────────────────────────────
title: "&f%time%"
subtitle: "&6+%coins% &7coins"

# ──────────────────────────────────────────────────────────────────────────────
