# FastBuilder Messages
# Color scheme: &c = labels/highlights | &f = main text | &7 = secondary | &8 = separator (» only)

# Action bar timer display
# Placeholders: %timer% / %time%
action-bar: "&7Time &8» &c%time%"

# ──────────────────────────────────────────────────────────────────────────────
# Completion messages
# Placeholders: %time%, %pb%, %difference%, %coins%, %booster%
# ──────────────────────────────────────────────────────────────────────────────
end-messages:
  time:
    - "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "&fCourse complete!"
    - ""
    - "&c● Time: &f%time%"
    - "&c● PB: &f%pb% &8» &7%difference%"
    - "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  personal-best:
    - "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "&c&lNew Personal Best!"
    - ""
    - "&fCourse complete!"
    - ""
    - "&c● Time: &f%time%"
    - "&c● PB: &f%pb% &8» &c%difference%"
    - "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ──────────────────────────────────────────────────────────────────────────────
# General messages
# Placeholders: %prefix%, %map%, %island_player%, %island_number%, %command%,
#               %player%, %coins%, %amount%, %time%, %rank%
# ──────────────────────────────────────────────────────────────────────────────
messages:
  joined-mode: "%prefix%&fJoined &c%map%&f."
  island-already-occupied: "%prefix%&cIsland is occupied by &f%island_player%&c."
  island-joined: "%prefix%&fJoined island &c#%island_number%&f."
  no-permission: "%prefix%&cNo permission."
  usage: "%prefix%&c● Usage: &f%command%"
  player-not-found: "%prefix%&cPlayer &f%player% &cnot found."
  map-not-found: "%prefix%&cMap &f%map% &cnot found."
  map-disabled: "%prefix%&cMap &f%map% &cis disabled."
  no-free-islands: "%prefix%&cNo free islands available."
  cannot-build-here: "%prefix%&cYou can only build on your own island."
  teleported-default: "%prefix%&fSent to the default map."
  map-already-on: "%prefix%&cYou are already on this map."
  practice-blocks-cleared: "%prefix%&fPractice blocks cleared."
  setup-spawn-not-east: "%prefix%&cSpawn must face East. Re-select or use &f/map setup continue --force&c."
  no-islands: "%prefix%&cNo islands available right now."
  playtime-reward: "%prefix%&c+%coins% coins &8» &fPlaytime."
  min-time-not-recorded: "%prefix%&cTime too fast to record &7(&f%time%&7)."
  max-time-exceeded: "%prefix%&cRun failed &8» &fTime limit exceeded."
  rank-achieved: "%prefix%&fYou reached &c%rank% &frank on &c%map%&f."
  coins-balance: "%prefix%&fBalance: &c%coins% coins&f."
  coins-balance-other: "%prefix%&c%player% &fhas &c%coins% coins&f."
  coins-added: "%prefix%&c+%amount% coins &8» &f%player%&f."
  coins-removed: "%prefix%&c-%amount% coins &8» &f%player%&f."
  coins-set: "%prefix%&fCoins for &c%player% &fset to &c%amount%&f."
  coins-not-enough: "%prefix%&cNot enough coins."
  build-mode-enter: "%prefix%&fBuild Mode &cenabled&f. Use &c/build &fagain to exit."
  build-mode-exit: "%prefix%&fBuild Mode &cdisabled&f."
  build-mode-not-on-island: "%prefix%&cYou must be on an island to use Build Mode."

# ──────────────────────────────────────────────────────────────────────────────
# Completion title / subtitle
# Placeholders: %time%, %coins%, %booster%
# ──────────────────────────────────────────────────────────────────────────────
title: "&cTime: &f%time%"
subtitle: "&c+%coins% &fcoins"

