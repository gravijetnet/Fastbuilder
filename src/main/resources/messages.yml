  setup-not-ready: "%prefix%&cFinish the current step first."
  setup-spawn-not-east: "%prefix%&cSpawn must face east. Use &f/map setup continue --force&c to override."
  map-enabled: "%prefix%&a%map% &7enabled."
  map-disabled: "%prefix%&c%map% &7disabled."
  map-renamed: "%prefix%&7Renamed &f%old% &8» &f%new%"
  map-icon-set: "%prefix%&7Icon for &f%map% &8» &f%icon%"
  map-scale-set: "%prefix%&7Scale for &f%map% &8» &f%scale%"
  map-distance-set: "%prefix%&7Gap for &f%map% &8» &f%distance% blocks"
  map-autoscale-set: "%prefix%&7Autoscale for &f%map% &8» &f%value%"
  map-already-exists: "%prefix%&cA map by that name already exists."
  distance-too-small: "%prefix%&cMinimum distance is &f%min% blocks&c."
  scale-updating: "%prefix%&7Resizing &f%map%&7..."
  island-reset: "%prefix%&7Island reset."
  not-on-island: "%prefix%&cYou're not on an island."
  config-reloaded: "%prefix%&aConfig reloaded."
  setup-spawn-not-east-player: "%prefix%&cSpawn must face east &7(yaw -90)&c. &f/map setup continue --force &cto override."
  usage: "%prefix%&7Usage &8» &f%command%"

