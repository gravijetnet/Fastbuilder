  setup-spawn-saved: "%prefix%&fSpawn saved. Type &c/map setup continue &fto proceed."
  setup-npc-saved: "%prefix%&fNPC location saved. Type &c/map setup continue &fto proceed."
  setup-select-finish: "%prefix%&fSelect the finish zone &8» &7Left-click: Pos 1 &7| &7Right-click: Pos 2."
  setup-finish-pos1: "%prefix%&c● Finish Pos 1 &fset at &c%x% %y% %z%&f."
  setup-finish-pos2: "%prefix%&c● Finish Pos 2 &fset at &c%x% %y% %z%&f."
  setup-finish-ready: "%prefix%&fFinish zone set. Type &c/map setup finish <name> &fto save."
  setup-saved: "%prefix%&fTemplate saved. Type &c/map setup finish <name> &fto finish."
  setup-complete: "%prefix%&fMap &c%map% &fcreated &7(disabled by default)&f."
  setup-no-session: "%prefix%&cNo active setup session."
  setup-not-ready: "%prefix%&cComplete the current step before continuing."
  setup-spawn-not-east: "%prefix%&cSpawn must face East. Use &f/map setup continue --force &cto bypass."
  map-enabled: "%prefix%&fMap &c%map% &fenabled."
  map-disabled: "%prefix%&fMap &c%map% &fdisabled."
  map-renamed: "%prefix%&fMap renamed: &c%old% &8» &c%new%&f."
  map-icon-set: "%prefix%&fIcon for &c%map% &fset to &c%icon%&f."
  map-scale-set: "%prefix%&fScale for &c%map% &fset to &c%scale%&f."
  map-distance-set: "%prefix%&fGap for &c%map% &fset to &c%distance% blocks&f."
  map-autoscale-set: "%prefix%&fAutoscale for &c%map% &fset to &c%value%&f."
  map-already-exists: "%prefix%&cA map with that name already exists."
  distance-too-small: "%prefix%&cDistance must be at least &f%min% blocks&c."
  scale-updating: "%prefix%&fUpdating island count for &c%map%&f..."
  island-reset: "%prefix%&fIsland reset."
  left-game: "%prefix%&fYou left."
  not-on-island: "%prefix%&cYou are not on an island."
  config-reloaded: "%prefix%&fConfig reloaded."
  setup-spawn-not-east-player: "%prefix%&cSpawn must face East &7(yaw -90)&c. Use &f/map setup continue --force &cto override."
  usage: "%prefix%&c● Usage: &f%command%"

# ──────────────────────────────────────────────────────────────────────────────
# Booster messages
# Placeholders: %player%, %amount%, %type%, %multiplier%, %remaining%
# ──────────────────────────────────────────────────────────────────────────────
booster:
  no-permission: "%prefix%&cNo permission for booster admin commands."
  only-players: "%prefix%&cOnly players can open the booster menu."
  types-header: "%prefix%&fBooster types:"
  types-empty: "%prefix%&cNo booster types configured."
  type-entry: "&7  &c%id% &8» &f%multiplier% &7| &c%duration%m &7| &c%price% coins"
  info-header: "%prefix%&fBoosters for &c%player%&f:"
  info-active: "&7  &c● Active: &f%multiplier% &7(%remaining% remaining)"
  info-none: "&7  &c● Active: &7None"
  info-inventory-entry: "&7  &c● Inventory: &f%amount%x &c%type%"
  info-inventory-empty: "&7  &c● Inventory: &7(empty)"
  give-sender: "%prefix%&fGave &c%amount%x %type% &fto &c%player%&f."
  give-target: "%prefix%&fYou received &c%amount%x %type% &8» &fActivate from your Booster Inventory."
  take-success: "%prefix%&fRemoved &c%amount%x %type% &ffrom &c%player%&f."
  take-none: "%prefix%&c%player% &fhas no &c%type% &fboosters."
  clear-success: "%prefix%&fCleared all boosters for &c%player%&f."
  invalid-amount: "%prefix%&cInvalid amount."
  player-offline: "%prefix%&cPlayer &f%player% &cis not online."
  data-error: "%prefix%&cCould not load data for &c%player%&f."
  unknown-type: "%prefix%&cUnknown booster type &f%type%&c."
  usage-header: "%prefix%&fBooster admin commands:"
  usage-give: "&7  &c● /booster give &f<player> <type> [amount]"
  usage-take: "&7  &c● /booster take &f<player> <type> [amount]"
  usage-clear: "&7  &c● /booster clear &f<player>"
  usage-info: "&7  &c● /booster info &f<player>"
