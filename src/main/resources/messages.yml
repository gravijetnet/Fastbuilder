  setup-spawn-saved: "%prefix%&aSpawn saved. Continue with &f/map setup continue&a."
  setup-npc-saved: "%prefix%&aNPC location saved. Continue with &f/map setup continue&a."
  setup-select-finish: "%prefix%&7Mark the finish &8» &7left-click pos 1, right-click pos 2."
  setup-finish-pos1: "%prefix%&7Finish corner 1 &8» &f%x% %y% %z%"
  setup-finish-pos2: "%prefix%&7Finish corner 2 &8» &f%x% %y% %z%"
  setup-finish-ready: "%prefix%&aFinish zone set. Run &f/map setup finish <name>&a."
  setup-saved: "%prefix%&aTemplate stored. Run &f/map setup finish <name>&a."
  setup-complete: "%prefix%&aSaved &f%map% &7(disabled until you enable it)"
  setup-no-session: "%prefix%&cNo setup in progress."
  setup-not-ready: "%prefix%&cFinish the current step first."
  setup-spawn-not-east: "%prefix%&cSpawn must face east. Use &f/map setup continue --force&c to override."
  map-enabled: "%prefix%&a%map% &7enabled."
  map-disabled: "%prefix%&c%map% &7disabled."
  map-renamed: "%prefix%&7Renamed &f%old% &8» &f%new%"
  map-icon-set: "%prefix%&7Icon for &f%map% &8» &f%icon%"
  map-scale-set: "%prefix%&7Scale for &f%map% &8» &f%scale%"
  map-distance-set: "%prefix%&7Gap for &f%map% &8» &f%distance% blocks"
  map-autoscale-set: "%prefix%&7Autoscale for &f%map% &8» &f%value%"
  map-already-exists: "%prefix%&cA map by that name already exists."
  distance-too-small: "%prefix%&cMinimum distance is &f%min% blocks&c."
  scale-updating: "%prefix%&7Resizing &f%map%&7..."
  island-reset: "%prefix%&7Island reset."
  left-game: "%prefix%&7See you next time."
  not-on-island: "%prefix%&cYou're not on an island."
  config-reloaded: "%prefix%&aConfig reloaded."
  setup-spawn-not-east-player: "%prefix%&cSpawn must face east &7(yaw -90)&c. &f/map setup continue --force &cto override."
  usage: "%prefix%&7Usage &8» &f%command%"

# ──────────────────────────────────────────────────────────────────────────────
# Booster messages
# Placeholders: %player%, %amount%, %type%, %multiplier%, %remaining%
# ──────────────────────────────────────────────────────────────────────────────
booster:
  no-permission: "%prefix%&cNo permission for booster admin commands."
  only-players: "%prefix%&cOnly players can open the booster menu."
  types-header: "%prefix%&fBooster types"
  types-empty: "%prefix%&7No booster types configured."
  type-entry: "  &c%id% &8» &f%multiplier%x &7| &f%duration%m &7| &6%price% coins"
  info-header: "%prefix%&fBoosters &7&ofor &f%player%"
  info-active: "  &7Active &8» &a%multiplier%x &7(%remaining% left)"
  info-none: "  &7Active &8» &7none"
  info-inventory-entry: "  &7Stock &8» &f%amount%x &c%type%"
  info-inventory-empty: "  &7Stock &8» &7empty"
  give-sender: "%prefix%&7Gave &f%amount%x %type% &7to &f%player%"
  give-target: "%prefix%&aYou got &f%amount%x %type%&a. &7Activate it from your booster inventory."
  take-success: "%prefix%&7Took &f%amount%x %type% &7from &f%player%"
  take-none: "%prefix%&7%player% &chas no &f%type% &cboosters."
  clear-success: "%prefix%&7Cleared boosters for &f%player%"
  invalid-amount: "%prefix%&cInvalid amount."
  player-offline: "%prefix%&cPlayer &f%player% &cis offline."
  data-error: "%prefix%&cCouldn't load data for &f%player%&c."
  unknown-type: "%prefix%&cNo booster called &f%type%&c."
  usage-header: "%prefix%&fBooster admin"
  usage-give: "  &7/booster give &f<player> <type> [amount]"
  usage-take: "  &7/booster take &f<player> <type> [amount]"
  usage-clear: "  &7/booster clear &f<player>"
  usage-info: "  &7/booster info &f<player>"
