# FastBuilder Messages
# Palette: &c highlight / &f text / &7 muted / &8 separator
# Tip: keep lines short. The plugin prefix is prepended via %prefix%.

# Action bar shown during a run. %time% = current run timer.
action-bar: "&7Time &8» &c%time%"

# ──────────────────────────────────────────────────────────────────────────────
# Completion messages
# Placeholders: %time%, %pb%, %difference%, %coins%, %booster%
# ──────────────────────────────────────────────────────────────────────────────
end-messages:
  time:
    - ""
    - "  &c&lFINISHED"
    - "  &7%time%  &8|  &7best &f%pb%  &8|  &7%difference%"
    - ""
  personal-best:
    - ""
    - "  &c&lNEW RECORD"
    - "  &f%time%  &8|  &7-%difference% &8from PB"
    - ""

# ──────────────────────────────────────────────────────────────────────────────
# General messages
# Placeholders: %prefix%, %map%, %island_player%, %island_number%, %command%,
#               %player%, %coins%, %amount%, %time%, %rank%
# ──────────────────────────────────────────────────────────────────────────────
messages:
  joined-mode: "%prefix%&7Welcome to &f%map%&7."
  island-already-occupied: "%prefix%&cThat island belongs to &f%island_player%&c."
  island-joined: "%prefix%&7Moved to island &f#%island_number%&7."
  no-permission: "%prefix%&cYou can't do that."
  usage: "%prefix%&7Usage &8» &f%command%"
  player-not-found: "%prefix%&cCan't find &f%player%&c."
  map-not-found: "%prefix%&cNo map called &f%map%&c."
  map-disabled: "%prefix%&f%map% &7is currently disabled."
  no-free-islands: "%prefix%&cAll islands are taken right now."
  island-scaling: "%prefix%&7Spinning up a new island &8— &fjust a sec."
  cannot-build-here: "%prefix%&cStay on your own island."
  teleported-default: "%prefix%&7Sent you to the default map."
  map-already-on: "%prefix%&7You're already on this map."
  practice-blocks-cleared: "%prefix%&7Practice blocks cleared."
  setup-spawn-not-east: "%prefix%&cSpawn must face east. Re-select or use &f/map setup continue --force&c."
  no-islands: "%prefix%&cNo islands available."
  playtime-reward: "%prefix%&6+%coins% coins &7&ofor playtime"
  min-time-not-recorded: "%prefix%&cToo fast to record &8(&7%time%&8)"
  max-time-exceeded: "%prefix%&cRun expired &8— &7time limit reached"
  rank-achieved: "%prefix%&7You reached &c%rank% &7on &f%map%&7."
  coins-balance: "%prefix%&7Balance &8» &6%coins% coins"
  coins-balance-other: "%prefix%&f%player% &7has &6%coins% coins&7."
  coins-added: "%prefix%&a+%amount% &7to &f%player%"
  coins-removed: "%prefix%&c-%amount% &7from &f%player%"
  coins-set: "%prefix%&f%player%&7's balance &8» &6%amount%"
  coins-not-enough: "%prefix%&cNot enough coins."
  build-mode-enter: "%prefix%&aBuild mode on &7&o— use /build to exit"
  build-mode-exit: "%prefix%&7Build mode off."
  build-mode-not-on-island: "%prefix%&cYou need to be on an island for build mode."

# ──────────────────────────────────────────────────────────────────────────────
# Completion title / subtitle shown above the hotbar
# Placeholders: %time%, %coins%, %booster%
# ──────────────────────────────────────────────────────────────────────────────
title: "&f%time%"
subtitle: "&6+%coins% &7coins"

# ──────────────────────────────────────────────────────────────────────────────
# Admin / setup messages
# ──────────────────────────────────────────────────────────────────────────────
admin:
  setup-started: "%prefix%&7Setup ready &8» &7left-click corner 1, right-click corner 2."
