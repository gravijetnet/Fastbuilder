# FastBuilder GUI Configuration

# Block Selector GUI
# Placeholder: %page% - Current page number
block-selector:
  name: "Block Selector - %page%/3"
  max-slots: 45

# Mode Changer GUI
mode-changer:
  name: "Mode Changer - %page%/1"
  max-slots: 45

# Settings GUI
settings:
  name: "Settings"
  max-slots: 27

# Confirm Reset Stats GUI
confirm-stats-reset: "Confirm"

# Island Selector GUI
island-selector: "Island Selector"

# Replays GUI
# Placeholders: %page%, %max_page%
replays: "Replays - Page %page%/%max_page%"

# Block status messages
block-status:
  purchased: "&aYou already own this block!"
  not-purchased: "&cYou don't own this block yet!"

# Settings GUI slot layout
# Available GUIs: block_selector, mode_changer, island_selector, reset_stats, practice_mode
# Placeholders: %practice_mode_enabled%, %price%
settings-gui-slots:
  12:
    name: "&eBlock Selector"
    material: SANDSTONE:0
    gui: "block_selector"
    lore:
      - ""
  14:
    name: "&cReset Stats"
    material: DIAMOND_PICKAXE:0
    gui: "reset_stats"
    lore:
      - "&7Reset Stats on all modes!"
      - "&ePrice: %price%"
  16:
    name: "&aPractice Mode"
    material: STAINED_CLAY:0
    gui: "practice_mode"
    lore:
      - "%practice_mode_enabled%"

# Mode Changer GUI slot layout
mode-changer-slots:
  1:
    1:
      name: "Short"
      material: SANDSTONE:0
      mode: "short"
      lore:
        - ""

