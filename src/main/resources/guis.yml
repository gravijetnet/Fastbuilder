# FastBuilder GUI Configuration

# Booster Menus
booster-hub:
  name: "&cBooster Menu"
  shop-slot: 11
  status-slot: 13
  inventory-slot: 15
  back-slot: 22
booster-shop:
  name: "&cBooster Shop"
  status-slot: 4
  inventory-btn-slot: 45
  back-slot: 49
booster-inventory:
  name: "&cBooster Inventory"
  status-slot: 4
  shop-btn-slot: 45
  back-slot: 49

# Block Selector GUI
# Placeholder: %page% - Current page number
block-selector:
  name: "Block Selector - %page%/%max_page%"
  max-slots: 45

# Mode Changer GUI
mode-changer:
  name: "Mode Changer - %page%/1"
  max-slots: 45

# Settings GUI
settings:
  name: "Settings"
  max-slots: 27

# Confirm Reset Stats GUI
confirm-stats-reset: "Confirm"

# Map Selector GUI
map-selector:
  name: "Map Selector"
  max-slots: 54
  # Filler items fill all empty slots
  filler:
    enabled: true
    material: "STAINED_GLASS_PANE:7"
    name: " "
  # Map slot assignments (slot -> map name). Unassigned maps go in the first free slot.
  slots: {}

# Island Selector GUI
island-selector: "Island Selector"

# Replays GUI
# Placeholders: %page%, %max_page%
replays: "Replays - Page %page%/%max_page%"

# Block status messages
block-status:
  purchased: "&aYou already own this block!"
  not-purchased: "&cYou don't own this block yet!"

# Pickaxe/tool status messages
pickaxe-status:
  purchased: "&aYou already own this pickaxe!"
  not-purchased: "&cYou don't own this pickaxe yet!"

# Settings GUI slot layout (3×9 = 27 slots, items centered in second row)
# Available GUIs: infinite_blocks, reset_stats, practice_mode, custom_length
# Placeholders: %practice_mode_enabled%, %infinite_blocks_status%, %infinite_blocks_unlocked%, %price%, %custom_length%
settings-gui-slots:
  10:
    name: "&bInfinite Blocks"
    material: BEDROCK:0
    gui: "infinite_blocks"
    lore:
      - "&7Status: %infinite_blocks_status%"
      - "&7Unlock: %infinite_blocks_unlocked%"
      - ""
      - "&7Blocks never run out"
      - "&eUnlock cost: &c1000 coins"
  12:
    name: "&cReset Stats"
    material: DIAMOND_PICKAXE:0
    gui: "reset_stats"
    lore:
      - "&7Reset stats on all modes!"
      - "&ePrice: &c%price% coins"
  14:
    name: "&aPractice Mode"
    material: STAINED_CLAY:0
    gui: "practice_mode"
    lore:
      - "&7Status: %practice_mode_enabled%"
      - ""
      - "&7Blocks stay on fall"
      - "&7Time is not recorded"
  16:
    name: "&6Custom Length"
    material: STICK:0
    gui: "custom_length"
    lore:
      - "&7Click to configure the distance and height."

# Mode Changer GUI slot layout
mode-changer-slots:
  1:
    1:
      name: "Short"
      material: SANDSTONE:0
      mode: "short"
      lore:
        - ""

