# Island Selector GUI (dynamic auto-sizing)
island-selector-gui:
  # Max islands per page before pagination activates (must be a multiple of 9, ≤ 45)
  page-size: 45

# Shop GUI
shop:
  name: "Shop"
  # GUI size — any valid inventory size (9/18/27/36/45/54). Auto-scales; remove the old 27 cap.
  max-slots: 45
  # Row 2 (slots 9–17): three category buttons centered with spacing
  blocks-slot: 10
  pickaxes-slot: 13
  designs-slot: 16
  # Row 4 (slots 27–35): three more category buttons
  boosters-slot: 28
  animations-slot: 31
  death-sounds-slot: 34
  # Fully configurable shop category buttons.
  # material: ItemBuilder string (e.g. "EMERALD_BLOCK:0"), name: color-coded display name,
  # lore: list of lore lines (empty list uses the built-in default).
  items:
    blocks:
      material: "SANDSTONE:0"
      name: "&eBlocks"
      lore:
        - "&7Click to browse building blocks"
        - ""
        - "&aClick to browse"
    pickaxes:
      material: "DIAMOND_PICKAXE:0"
      name: "&bPickaxe Shop"
      lore:
        - "&7Click to browse pickaxes and tools"
        - ""
        - "&aClick to browse"
    # Island Designs icon when the current map HAS alternative designs
    designs-active:
      material: "EMERALD_BLOCK:0"
      name: "&aIsland Designs"
      lore:
        - "&7Choose a design for your island"
        - ""
        - "&aClick to browse"
    # Island Designs icon when the current map has NO alternative designs
    designs-inactive:
      material: "EMERALD_BLOCK:0"
      name: "&7Island Designs"
      lore:
        - "&7No designs available for this map"
    animations:
      material: "FIREWORK:0"
      name: "&dReset Animations"
      lore:
        - "&7Click to browse reset animations"
        - ""
        - "&aClick to browse"
    sounds:
      material: "NOTE_BLOCK:0"
      name: "&6Death Sounds"
      lore:
        - "&7Click to browse death sounds"
        - ""
        - "&aClick to browse"

# Death Sound Selector GUI
death-sound-selector:
  name: "Death Sounds"
  max-slots: 27

