# FastBuilder GUI Configuration

# Block Selector GUI
# Placeholder: %page% - Current page number
block-selector:
  name: "Block Selector - %page%/3"
  max-slots: 45

# Mode Changer GUI
mode-changer:
  name: "Mode Changer - %page%/1"
  max-slots: 45

# Settings GUI
settings:
  name: "Settings"
  max-slots: 27

# Confirm Reset Stats GUI
confirm-stats-reset: "Confirm"

# Map Selector GUI
map-selector:
  name: "Map Selector"
  max-slots: 54
  # Filler items fill all empty slots
  filler:
    enabled: true
    material: "STAINED_GLASS_PANE:7"
    name: " "
  # Map slot assignments (slot -> map name). Unassigned maps go in the first free slot.
  slots: {}

# Island Selector GUI
island-selector: "Island Selector"

# Replays GUI
# Placeholders: %page%, %max_page%
replays: "Replays - Page %page%/%max_page%"

# Block status messages
block-status:
  purchased: "&aYou already own this block!"
  not-purchased: "&cYou don't own this block yet!"

# Settings GUI slot layout
# Available GUIs: infinite_blocks, mode_changer, island_selector, reset_stats, practice_mode
# Placeholders: %practice_mode_enabled%, %infinite_blocks_status%, %infinite_blocks_unlocked%, %price%
settings-gui-slots:
  11:
    name: "&bInfinite Blocks"
    material: STAINED_GLASS_PANE:11
    gui: "infinite_blocks"
    lore:
      - "&7Status: %infinite_blocks_status%"
      - "&7Unlock: %infinite_blocks_unlocked%"
      - ""
      - "&7Blocks never run out"
      - "&eUnlock cost: &c1000 coins"
  13:
    name: "&cReset Stats"
    material: DIAMOND_PICKAXE:0
    gui: "reset_stats"
    lore:
      - "&7Reset stats on all modes!"
      - "&ePrice: &c%price% coins"
  15:
    name: "&aPractice Mode"
    material: STAINED_CLAY:0
    gui: "practice_mode"
    lore:
      - "&7Status: %practice_mode_enabled%"
      - ""
      - "&7Blocks stay on fall"
      - "&7Time is not recorded"

# Mode Changer GUI slot layout
mode-changer-slots:
  1:
    1:
      name: "Short"
      material: SANDSTONE:0
      mode: "short"
      lore:
        - ""

