name: Build and Permanent Release Fastbuilder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # All dependencies (including spigot-api 1.8.8) resolve from the public
      # SpigotMC/JitPack/CodeMC repositories declared in pom.xml — no BuildTools
      # run is needed, which keeps CI at ~1 minute instead of ~15.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Prepare Artifacts
        if: github.event_name != 'pull_request'
        run: |
          JAR_PATH=$(find target/ -name "Fastbuilder-*.jar" ! -name "original-*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then echo "Error: JAR not found"; exit 1; fi
          cp "$JAR_PATH" ./fastbuilder-build-${{ github.run_number }}.jar
          cp "$JAR_PATH" ./fastbuilder-latest.jar

      - name: Create Archive Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Fastbuilder Build #${{ github.run_number }}"
          body: "Archive of Build #${{ github.run_number }}."
          files: fastbuilder-build-${{ github.run_number }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Fastbuilder Latest Build"
          make_latest: true
          files: fastbuilder-latest.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
