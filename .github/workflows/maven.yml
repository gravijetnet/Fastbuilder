name: Build and Permanent Release Fastbuilder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Prepare JAR
      run: |
        JAR_PATH=$(find target/ -name "Fastbuilder-*.jar" ! -name "*shaded*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        if [ -z "$JAR_PATH" ]; then echo "Error: JAR not found"; exit 1; fi
        cp "$JAR_PATH" ./fastbuilder-build-${{ github.run_number }}.jar
        cp "$JAR_PATH" ./fastbuilder-latest.jar

    # Schritt 1: Archiv-Release (für die Historie)
    - name: Create Archive Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Fastbuilder Build #${{ github.run_number }}"
        body: "Archive of Build #${{ github.run_number }}."
        files: fastbuilder-build-${{ github.run_number }}.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # SCHRITT 2: Den alten 'latest' Tag löschen (Zwingt GitHub den Source Code zu aktualisieren)
    - name: Delete Old Latest Tag
      run: |
        git tag -d latest || true
        git push origin :refs/tags/latest || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # SCHRITT 3: Latest Release neu erstellen (Wird dadurch immer ganz oben angezeigt)
    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Fastbuilder LATEST Build"
        body: |
          **Status:** Aktuellster Build vom ${{ github.event.head_commit.timestamp }}
          Dieser Release enthält immer den **neuesten Source Code** und das aktuellste JAR.
        files: fastbuilder-latest.jar
        # 'prerelease: false' und 'make_latest: true' sorgen für die Sortierung ganz oben
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
