name: Build and Permanent Release Fastbuilder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Prepare JAR
      run: |
        JAR_PATH=$(find target/ -name "Fastbuilder-*.jar" ! -name "*shaded*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        if [ -z "$JAR_PATH" ]; then echo "Error: JAR not found"; exit 1; fi
        
        cp "$JAR_PATH" ./fastbuilder-build-${{ github.run_number }}.jar
        cp "$JAR_PATH" ./fastbuilder-latest.jar

    # Step 1: Permanent Archive (Unique Tag)
    - name: Create Archive Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Fastbuilder Build #${{ github.run_number }}"
        body: "Archive of Build #${{ github.run_number }}. Includes source at this state."
        files: fastbuilder-build-${{ github.run_number }}.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Step 2: Update Latest Release (Points the 'latest' tag to NEWEST source)
    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Fastbuilder Latest Build"
        body: "This release always contains the NEWEST JAR and NEWEST Source Code."
        # This moves the 'latest' marker to the current commit
        make_latest: true
        files: fastbuilder-latest.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
