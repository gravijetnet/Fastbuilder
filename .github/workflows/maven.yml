name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # DIESER TEIL IST WICHTIG:
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Empfohlen für saubere Git-Operationen

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Move JAR to root and Commit
      run: |
        # Sucht die richtige Fastbuilder JAR (ohne shaded/sources/javadoc)
        JAR_PATH=$(find target/ -name "Fastbuilder-*.jar" ! -name "*shaded*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        
        if [ -z "$JAR_PATH" ]; then
          echo "Fehler: Keine Fastbuilder JAR gefunden!"
          exit 1
        fi
        
        mv "$JAR_PATH" ./fastbuilder-latest.jar
        
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add -f fastbuilder-latest.jar
        git commit -m "Update Fastbuilder JAR [skip ci]" || echo "No changes to commit"
        git push
