name: Build and Permanent Release Fastbuilder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 8 (for BuildTools)
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Run BuildTools
      run: |
        mkdir buildtools && cd buildtools
        wget -q https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
        
        # Build Spigot 1.8.8
        java -jar BuildTools.jar --rev 1.8.8 --compile craftbukkit
        
        # BROAD SEARCH: Look for bungeecord-chat anywhere in the buildtools folder
        echo "Searching for bungeecord-chat..."
        CHAT_JAR=$(find . -name "bungeecord-chat-*.jar" | grep -v "sources" | head -n 1)
        
        if [ -z "$CHAT_JAR" ]; then
          echo "Error: bungeecord-chat JAR not found!"
          echo "Listing directory structure for debugging:"
          ls -R
          exit 1
        fi
        
        echo "Found chat jar at: $CHAT_JAR. Installing to local repository..."
        
        mvn install:install-file \
          -Dfile="$CHAT_JAR" \
          -DgroupId=net.md-5 \
          -DartifactId=bungeecord-chat \
          -Dversion=1.8-SNAPSHOT \
          -Dpackaging=jar

    - name: Set up JDK 21 (for Maven Build)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Prepare Artifacts
      run: |
        JAR_PATH=$(find target/ -name "Fastbuilder-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        if [ -z "$JAR_PATH" ]; then echo "Error: JAR not found"; exit 1; fi
        cp "$JAR_PATH" ./fastbuilder-build-${{ github.run_number }}.jar
        cp "$JAR_PATH" ./fastbuilder-latest.jar

    - name: Create Archive Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Fastbuilder Build #${{ github.run_number }}"
        body: "Archive of Build #${{ github.run_number }}."
        files: fastbuilder-build-${{ github.run_number }}.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Fastbuilder Latest Build"
        body: "This release always contains the newest version of the plugin."
        make_latest: true
        files: fastbuilder-latest.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
